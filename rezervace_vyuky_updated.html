
<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rezervace výuky</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(to right, #fceabb, #f8b500);
      color: #333;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #ff4081;
    }
    .image-container {
      text-align: center;
      margin-top: 20px;
    }
    img {
      max-width: 100%;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    .info {
      margin-top: 30px;
      text-align: center;
      font-size: 1.1em;
    }
  </style>
</head>
<body>
  <h1>Rezervace výuky</h1>

  <div class="image-container">
    <img src="jpeg.jpeg" alt="Formulář s popisky">
  </div>

  <div class="info">
    <p>Do formuláře zadej své jméno, email pro komunikaci a napiš zprávu, do které uveď, o jaké téma látky máš zájem.</p>
    <p>Domluvíme si termín. Zároveň do emailu obdržíš QR kód pro platbu.</p>
    <p>Poté se spojíme pomocí Google Meet podle instrukcí, které sdělím.</p>
  </div>
</body>
</html>
